# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Linear independence of 1, ζ(2), ζ(3) over ℚ"
  description: >-
    A Lean formalization of the linear independence of 1, ζ(2) and ζ(3)
    over ℚ.
    The proof is inspired by A. Fauzan's work on the irrationality of
    ζ(5) and builds on the Lean formalization of the irrationality of
    Li₂(1/2), registered in Palomar as PALOMAR-2026-09-30-000013. It shows
    that the method of that proof can be pushed further.
    The main difference from the Li₂(1/2) proof is that the rational
    functions appearing here are allowed to have poles of order two. The
    remaining details are similar, with some minor modifications.
    The compared theorems depend on propext, Classical.choice and
    Quot.sound and on nothing else, and there is no sorry outside the
    deliberate holes in Challenge.lean.
  authors:
    - "Qian Tang"
  responsible_maintainers:
    - "Qian Tang"
  license: "Apache-2.0"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J72", "11M06"]

status:
  scope: >-
    Complete, with no unproved step. Formalized: 1, ζ(2), ζ(3) are linearly
    independent over ℚ, stated in Challenge.lean as
    LinearIndependent ℚ ![(1 : ℂ), riemannZeta 2, riemannZeta 3], with
    Mathlib's riemannZeta. A second compared theorem,
    one_zeta_two_zeta_three_linearIndependent_series, states the same result
    with ζ(2) and ζ(3) written as the series Σ_{n≥1} 1/n² and Σ_{n≥1} 1/n³.
    Nothing is assumed from the literature.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "one_zeta_two_zeta_three_linearIndependent"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "one_zeta_two_zeta_three_linearIndependent_series"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    The formal statement uses Mathlib's riemannZeta and LinearIndependent,
    with the three numbers viewed as complex numbers.
    The proof uses methods adapted from the cited work on ζ(5).

sources:
  - title: "Linear independence of 1, ζ(2), ζ(3) over ℚ"
    authors: ["Qian Tang"]
    id: "https://github.com/dtq1997/zeta2-zeta3-linear-independence"
    type: "original-proof"
    relationship: "other"
    note: "The proof is presented in this repository."

  - title: "ζ(5) is irrational"
    authors: ["Aabir Fauzan"]
    id: "https://doi.org/10.5281/zenodo.22826419"
    type: "preprint"
    relationship: "other"
    note: >-
      The proof adapts the polynomial approach of this
      paper to ζ(3) − r ζ(2).

  - title: "Irrationalité de ζ(2) et ζ(3)"
    authors: ["Roger Apéry"]
    type: "paper"
    location: "Astérisque 61 (1979), 11–13"
    relationship: "background"
    note: "The case r = 0 is Apéry's theorem."

  - title: "On the irrationality of certain quantities containing ζ(3)"
    authors: ["L. A. Gutnik"]
    id: "https://doi.org/10.4064/aa-42-3-255-264"
    type: "paper"
    location: "Acta Arith. 42 (1983), 255–264"
    relationship: "background"
    note: >-
      Proves that for every rational q at least one of −3ζ(3) + q ζ(2) and
      ζ(2) − 2q log 2 is irrational.

  - title: "The linear independence of 1, ζ(2), and L(2,χ₋₃)"
    authors: ["Frank Calegari", "Vesselin Dimitrov", "Yunqing Tang"]
    id: "https://arxiv.org/abs/2408.15403"
    type: "preprint"
    relationship: "background"

  - title: "On simultaneous diophantine approximations to ζ(2) and ζ(3)"
    authors: ["Simon Dauguet", "Wadim Zudilin"]
    id: "https://doi.org/10.1016/j.jnt.2014.06.007"
    type: "paper"
    location: "J. Number Theory 145 (2014), 362–387"
    relationship: "background"

  - title: "A Characterization of Umbral Calculus Inspired by Fractional Sums"
    authors: ["Qian Tang"]
    id: "https://arxiv.org/abs/2103.09117v1"
    type: "preprint"
    relationship: "other"
    note: >-
      The analytic umbral calculus developed in this paper was used to
      find the polynomials Q_n in the proof.

related_formalizations:
  - id: "https://palomar-registry.org/entry.html?id=PALOMAR-2026-09-30-000013&version=1"
    relationship: "adapts"
    note: >-
      Irrationality of Li₂(1/2), Palomar entry PALOMAR-2026-09-30-000013
      (dtq1997/li2-half-irrationality at commit 950ee9d). Auxiliary Lean
      developments were adapted from commit d5d8206 of the same repository,
      which only removes unused declarations from 950ee9d; see NOTICE for
      the files and attribution.
  - id: "https://github.com/siqiliu-tsinghua/Li2Rational/tree/b2a61c46c157860b57faa163341fda725c629139"
    relationship: "other"
    note: >-
      Si-Qi Liu's Lean formalization of the same method for Li₂(r) at
      rational points r, shared with the author.
  - id: "https://github.com/mo271/Zeta5/tree/f19a1960609f7d38e7b63fd2acb05e6f60a7b741"
    relationship: "adapts"
    note: "Selected auxiliary Lean developments were adapted; see NOTICE for the files and attribution."
  - id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd/tree/d7f9e2bfdcc7e34dfb9328b7494a6d424ff50c96"
    relationship: "adapts"
    note: "The prime-number-theorem developments listed in NOTICE were adapted."
  - id: "https://github.com/leanprover-community/mathlib4/pull/39232"
    relationship: "adapts"
    note: "The rectangular-contour residue development was adapted from commit cad38f70f5a649a40dbb3b334055a8e9aff69af5; see NOTICE."

# ---------------------------------------------------------------------------
# How this was produced.
# ---------------------------------------------------------------------------
automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "GPT-6 Astra (OpenAI)"]
      framework: "Claude Code; Codex"
      role: >-
        Wrote and revised the Lean formalization under the author's
        direction: formalizing the polynomial construction, proving the
        analytic and arithmetic estimates, and combining these results
        into the proof of the main theorem. Adapted auxiliary Lean code
        from the projects listed under related_formalizations, with
        attribution recorded in NOTICE. Also wrote Challenge.lean and
        Solution.lean, prepared comparator.json for the Palomar submission,
        and ran compilation and proof checks. The mathematical argument was
        also developed by the author with AI assistance.

review:
  status: "self-assessed"
  notes: >-
    The correspondence between the intended mathematical claim and the
    statement in Challenge.lean was checked by the author. The author
    has not fully reviewed the rest of the Lean code. Every formalized
    proof step is checked by Lean.

# ---------------------------------------------------------------------------
# Limitations, stated so that a reader can calibrate the claim.
# ---------------------------------------------------------------------------
known_gaps: []

limitations:
  - >-
    The proof is presented as a Lean development. No informal write-up
    accompanies it; section and lemma numbers in comments refer to the
    author's unpublished proof notes.
  - >-
    The compared theorems depend on propext, Classical.choice and
    Quot.sound, and on nothing else. There is no sorry in Zeta32/
    or Solution.lean, and no project-defined axiom, native_decide,
    unsafe declaration, @[implemented_by] or Float in the proof
    development.
  - >-
    The proof includes finite computations carried out using
    decide +kernel. These computations are checked by the Lean kernel.
  - >-
    Challenge.lean states each compared theorem with one deliberate
    sorry; that is the Comparator convention, and Solution.lean
    supplies the proofs.

# ---------------------------------------------------------------------------
# How the stated problem corresponds to the Lean declaration.
# ---------------------------------------------------------------------------
alignment:
  statements:
    - source: "Linear independence of 1, ζ(2), ζ(3) over ℚ"
      lean: "one_zeta_two_zeta_three_linearIndependent"
      module: "Challenge (statement), Solution (proof)"
      status: "author-checked"
      note: >-
        The statement of record, compared by Comparator. The Challenge and the
        Solution state the same proposition literally. Solution.lean obtains it
        from Zeta32.one_zeta_two_zeta_three_linearIndependent.
    - source: "Linear independence of 1, ζ(2), ζ(3) over ℚ, with the series written out"
      lean: "one_zeta_two_zeta_three_linearIndependent_series"
      module: "Challenge (statement), Solution (proof)"
      status: "author-checked"
      note: >-
        Also compared by Comparator. For rational a, b, c, if
        a + b Σ_{n≥1} 1/n² + c Σ_{n≥1} 1/n³ = 0 then a = b = c = 0; both series
        are written with index k = n − 1. Solution.lean derives it from the
        first theorem.

acknowledgements: "I thank Si-Qi Liu for related discussions and for sharing code with me."
